# Ubezpieczenie


prefix: "<reset><#f5f242><bold>Ubezpieczenie <reset><gray>» <reset><white>"

economy:
  price: 500.0
  renewal-price: 500.0
  currency-symbol: "$"

insurance:
  duration-days: 7
  expiry-warning-hours: 24
  online-warning-interval-minutes: 15
  allow-renewal: true
  cleanup-interval-minutes: 30

premium:
  permission: "insurance.premium"
  default-effect: "default"
  effects:
    default:
      slot: 10
      material: "TOTEM_OF_UNDYING"
      name: "<reset><white><bold>Standardowy"
      lore:
        - "<reset><white>Klasyczny efekt polisy."
      sound: "ITEM_TOTEM_USE"
      particle: "TOTEM_OF_UNDYING"
      particle-count: 80
    lightning:
      slot: 12
      material: "LIGHTNING_ROD"
      name: "<reset><aqua><bold>Piorun"
      lore:
        - "<reset><white>Efekt ratunku z błyskiem i grzmotem."
      sound: "ENTITY_LIGHTNING_BOLT_THUNDER"
      particle: "FLASH"
      particle-count: 1
    smoke:
      slot: 14
      material: "CAMPFIRE"
      name: "<reset><dark_gray><bold>Dym"
      lore:
        - "<reset><white>Efekt ratunku z dymną teleportacją."
      sound: "ENTITY_ENDERMAN_TELEPORT"
      particle: "CAMPFIRE_COSY_SMOKE"
      particle-count: 60
    magic:
      slot: 16
      material: "AMETHYST_SHARD"
      name: "<reset><light_purple><bold>Magia"
      lore:
        - "<reset><white>Efekt ratunku z magicznymi cząsteczkami."
      sound: "ENTITY_PLAYER_LEVELUP"
      particle: "WITCH"
      particle-count: 80

npc:
  provider: "CITIZENS"
  entity-type: "VILLAGER"
  name: "<reset><#f5f242><bold>Ubezpieczyciel"
  citizens-name: "<reset><#f5f242><bold>Ubezpieczyciel"
  skin: "Steve"
  glowing: false

sounds:
  open: "UI_BUTTON_CLICK"
  purchase: "ENTITY_PLAYER_LEVELUP"
  renewed: "BLOCK_NOTE_BLOCK_PLING"
  already-active: "ENTITY_VILLAGER_NO"
  no-money: "ENTITY_VILLAGER_NO"
  error: "BLOCK_ANVIL_LAND"
  totem-blocked: "ENTITY_VILLAGER_NO"

gui:
  title: "<reset><#f5f242><bold>Ubezpieczenie"
  open-cooldown-ms: 2000
  size: 27
  fill-empty: true
  filler:
    material: "YELLOW_STAINED_GLASS_PANE"
    name: " "
  insurance-item:
    slot: 13
    active-slot: 12
    material: "TOTEM_OF_UNDYING"
    name: "<reset><#f5f242><bold>Ubezpieczenie"
    lore:
      - "<reset><white>Jednorazowa ochrona przed śmiercią."
      - "<reset><white>Aktywuje się automatycznie przy zagrożeniu życia."
      - "<reset><white>Po użyciu polisa wygasa."
      - ""
      - "<reset><white>Koszt: <reset><#f5f242>{price}{currency}"
      - "<reset><white>Status: {status}"
      - "<reset><white>Efekt: {effect}"
      - "<reset><white>Ważna jeszcze: <reset><#f5f242>{time_left}"
    click-to-buy: "<reset><#f5f242>Kliknij, aby kupić polisę."
    already-owned: "<reset><white>Masz już aktywną polisę."
  renew-button:
    slot: 14
    material: "CLOCK"
    name: "<reset><#f5f242><bold>Przedłuż polisę"
    lore:
      - "<reset><white>Przedłuż ważność aktywnej polisy."
      - "<reset><white>Koszt: <reset><#f5f242>{renewal_price}{currency}"
      - "<reset><white>Ważna jeszcze: <reset><#f5f242>{time_left}"
      - ""
      - "<reset><gray>Dostępne w ostatnich 24h ważności."
  effect-menu-button:
    slot: 18
    material: "AMETHYST_CLUSTER"
    name: "<reset><#f5f242><bold>Efekt ratunku"
    lore:
      - "<reset><white>Wybierz animację aktywacji polisy."
      - "<reset><gray>Dostępne dla rangi premium."
  close-button:
    slot: 26
    material: "BARRIER"
    name: "<reset><red><bold>Wyjście"
    lore:
      - "<reset><gray>Kliknij, aby zamknąć menu."
  effects-menu:
    title: "<reset><#f5f242><bold>Wybór efektu"
    back:
      material: "ARROW"
      name: "<reset><red><bold>Powrót"
      lore:
        - "<reset><gray>Kliknij, aby wrócić do głównej zakładki."

protection:
  restore-health: 8.0
  restore-food: true
  food-level: 20
  saturation: 6.0
  extinguish: true
  clear-negative-effects: false
  no-damage-ticks: 60

  teleport-on-void: true

  sound: "ITEM_TOTEM_USE"
  particle: "TOTEM_OF_UNDYING"
  particle-count: 80

  ignored-damage-causes: []

  effects:
    REGENERATION:
      duration: 900
      amplifier: 1
      ambient: false
      particles: true
      icon: true
    ABSORPTION:
      duration: 100
      amplifier: 1
      ambient: false
      particles: true
      icon: true
    FIRE_RESISTANCE:
      duration: 800
      amplifier: 0
      ambient: false
      particles: true
      icon: true

messages:
  only-player: "<reset><#f5f242><bold>Ubezpieczenie <reset><gray>» <reset><red>Tylko gracz może użyć tej komendy."
  no-permission: "<reset><#f5f242><bold>Ubezpieczenie <reset><gray>» <reset><red>Brak uprawnień."
  premium-required: "<reset><#f5f242><bold>Ubezpieczenie <reset><gray>» <reset><red>Wybór efektu ratunku jest dostępny tylko dla rangi <reset><dark_red>Premium<reset><red>."
  error: "<reset><red>Wystąpił błąd. Spróbuj ponownie później."

  purchased: "<reset><white>Kupiłeś/aś polisę za <reset><#f5f242>{price}{currency}<reset><white>. Ochrona jest jednorazowa i ważna przez 7 dni."
  renewed: "<reset><white>Przedłużyłeś/aś ważność polisy za <reset><#f5f242>{renewal_price}{currency}<reset><white>. Ważna jeszcze: <reset><#f5f242>{time_left}<reset><white>."
  already-active: "<reset><red>Masz już aktywną polisę."
  renew-not-available: "<reset><red>Przedłużenie polisy będzie dostępne w ostatnich 24 godzinach ważności."
